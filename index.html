const meshes={}, home={}, placedSet=new Set(), benchDelta={}; let blockMode='cut';
function dims(n){ const m=meshes[n]; if(!m.userData.dims){ if(!m.geometry.boundingBox) m.geometry.computeBoundingBox(); m.userData.dims=m.geometry.boundingBox.getSize(new THREE.Vector3()); } return m.userData.dims; }
function sameShape(a,b){ if(a===b) return true; const da=dims(a),db=dims(b); const t=0.02*Math.max(da.length(),db.length()); return Math.abs(da.x-db.x)<t&&Math.abs(da.y-db.y)<t&&Math.abs(da.z-db.z)<t; }
function screenRadius(n){ const m=meshes[n]; if(!m.geometry.boundingSphere) m.geometry.computeBoundingSphere(); const r=m.geometry.boundingSphere.radius; const d=tgt(n).distanceTo(cam.position); const rect=r_dom(); return r/(d*Math.tan(THREE.MathUtils.degToRad(cam.fov/2)))*rect.height/2; }
function r_dom(){ return r.domElement.getBoundingClientRect(); }
const xrayOn=new Set(); function setXray(n,on){ const m=meshes[n]; if(!m) return; const hm=m.material; hm.transparent=on; hm.opacity=on?0.28:1; hm.depthWrite=!on; hm.needsUpdate=true; if(on) xrayOn.add(n); else xrayOn.delete(n); }
function tgt(n){ const p=home[n].p.clone(); const par=cur&&cur.attach; if(par&&benchDelta[par]&&n!==par) p.add(benchDelta[par]); return p; }
// position fixes: oil filter sits horizontally on the exhaust (front) side of the block, low, below the exhaust manifold
const FIX={ oil_filter_1:{p:[0.05,0.21,0.168], rx:Math.PI/2} };
const L=new GLTFLoader();
L.parse(Uint8Array.from(atob(window.ENGINE_GLB),c=>c.charCodeAt(0)).buffer,'',g=>{
  g.scene.traverse(o=>{ if(!o.isMesh) return;
    o.name=o.name.replace(/\.?001$/,''); o.geometry.computeBoundingBox(); const c=o.geometry.boundingBox.getCenter(new THREE.Vector3()); o.geometry.translate(-c.x,-c.y,-c.z); o.position.copy(c);
    if(FIX[o.name]){ const f=FIX[o.name]; if(f.p) o.position.set(...f.p); if(f.rx!==undefined) o.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),f.rx)); }
    meshes[o.name]=o; home[o.name]={p:o.position.clone(),q:o.quaternion.clone()};
    const m=o.material.clone(); m.flatShading=true; m.side=THREE.DoubleSide; m.metalness=Math.min(m.metalness??.3,.5); m.roughness=Math.max(m.roughness??.5,.45); m.needsUpdate=true; o.material=m;
    if(/^(main|rod)_bearing|thrust_washer/.test(o.name)) m.color.set(0xcfa870); if(/^(valve_|ring_|piston_pin)/.test(o.name)) m.color.set(0xd8dce2); if(/seal/.test(o.name)) m.color.set(0x333); if(/sprocket/.test(o.name)) m.color.set(0x9aa0aa);
    if(o.name==='block'){ m.color.set(0x9aa0a8); } { const c=m.color; const lum=0.299*c.r+0.587*c.g+0.114*c.b; if(lum<0.18) c.setRGB(0.36,0.38,0.42); }
    o.visible=false; });
  sc.add(g.scene); meshes.block.visible=true; applyBlock(); document.getElementById('load').style.display='none'; { const h=/#j(\d+)/.exec(location.hash); if(h){ const n=Math.min(+h[1],FLAT.length-1); for(let i=0;i<n;i++){ const f=FLAT[i]; if(f.parts){ autoPlace(f.parts); autoPlace(f.auto||[]); const par=f.attach&&meshes[f.attach]; if(par) [...f.parts,...(f.auto||[])].forEach(k=>{ const m=meshes[k]; if(m&&m!==par&&m.parent!==par) par.attach(m); }); } } idx=n-1; window._jf=true; } } nextStep();
});
function applyBlock(){ const b=meshes.block; b.visible=blockMode!=='hide'; b.material.clippingPlanes=blockMode==='cut'?[CUT]:[]; document.getElementById('btnBlock').textContent='เสื้อสูบ: '+({cut:'ผ่า',solid:'ทึบ',hide:'ซ่อน'})[blockMode]; }
document.getElementById('btnBlock').onclick=()=>{ blockMode={cut:'solid',solid:'hide',hide:'cut'}[blockMode]; applyBlock(); };

// ====================================================================
//  FLOW
// ====================================================================
const FLAT=[]; STAGES.forEach((st,si)=>st.steps.forEach(s=>FLAT.push(Object.assign({stage:si},s))));
let insp=null, pDown=null; let idx=-1, cur=null, stepParts=[], tray=[], orderIdx=0, miss=0, t0=null, done=false, stageMiss={}, camLocked=false;
const $=id=>document.getElementById(id);
function setCam(key){ const [p,t]=CAM[key]; cam.position.set(...p); ctl.target.set(...t); }
function nextStep(){
  idx++; if(idx>=FLAT.length){ finish(); return; }
  cur=FLAT[idx]; const st=STAGES[cur.stage]; $('prog').firstElementChild.style.width=(100*idx/FLAT.length)+'%';
  const prev=idx>0?FLAT[idx-1]:null, first=!prev||prev.stage!==cur.stage||window._jf; window._jf=false;
  const onBench=!!(cur.attach&&meshes[cur.attach]);   // a step with `attach` is done on the workbench, on that part
  if(first){ if(st.hideBlock){ blockMode='hide'; } else if(st.blockMode){ blockMode=st.blockMode; } else if(blockMode==='hide'){ blockMode='cut'; } showEngine(st); flash(st.name,'info',1400); }
  else if(prev.attach&&!onBench){ showEngine(st); }   // back from the workbench to the engine
  { const want=new Set(cur.xray||(st.hideHead?['cylinder_head']:[])); [...xrayOn].forEach(n=>{ if(!want.has(n)) setXray(n,false); }); want.forEach(n=>setXray(n,true)); }
  if(cur.quiz){ showQuiz(cur.quiz); return; }
  $('stage').textContent=st.name; $('title').textContent=cur.t; $('tip').textContent=cur.tip||'';
  stepParts=cur.parts.slice(); if(cur.ordered==='centerOut') stepParts=centerOut(stepParts);
  orderIdx=0; tray=stepParts.map(n=>meshes[n]).filter(Boolean);
  if(onBench){ const par=meshes[cur.attach]; if(!benchDelta[cur.attach]){ benchDelta[cur.attach]=BENCH.clone().sub(home[cur.attach].p); par.position.copy(BENCH); par.quaternion.copy(home[cur.attach].q); }
    Object.values(meshes).forEach(m=>{ if(m.parent && m.parent.type!=='Mesh') m.visible=false; }); par.visible=true; par.children.forEach(c=>c.visible=true);
    ctl.target.copy(BENCH); cam.position.copy(BENCH).add(new THREE.Vector3(...(cur.camOff||[0.22,0.20,0.34])));
    if(cur.focus && cur.focus!==cur.attach && home[cur.focus]){ const w=tgt(cur.focus); ctl.target.copy(w); cam.position.copy(w).add(new THREE.Vector3(...(cur.camOff||[0.16,0.28,0.22]))); } }
  else { if(cur.cam) setCam(cur.cam);
    if(cur.focus && meshes[cur.focus]){ const f=meshes[cur.focus]; const w=f.getWorldPosition(new THREE.Vector3()); ctl.target.copy(w); cam.position.copy(w).add(new THREE.Vector3(0.16,0.28,0.22)); } }
  if(!tray.length){ autoPlace(cur.auto||[]); setTimeout(nextStep,600); return; }
  layTray();
}
function showEngine(st){ Object.values(meshes).forEach(m=>{ if(m.name!=='block' && m.parent && m.parent.type!=='Mesh') m.visible=placedSet.has(m.name); }); setCam(st.cam); applyBlock(); }
function centerOut(names){ const cx=-0.024; return names.slice().sort((a,b)=>Math.abs(home[a].p.x-cx)-Math.abs(home[b].p.x-cx)); }
function worldHome(n){ return home[n].p.clone(); }

// ---- tray in front of the camera ----
const ghosts=[]; const GHOST=new THREE.MeshBasicMaterial({color:0x4f8cff,transparent:true,opacity:.45,depthWrite:false,depthTest:false});
function layTray(){
  clearGhosts(); const n=tray.length;
  tray.forEach((m,i)=>{ m.visible=true; if(m.parent&&m.parent.type==='Mesh'){ sc.attach(m); } m.quaternion.copy(home[m.name].q); m.userData.slot=i; m.userData.inTray=true; setTop(m,true); m.scale.setScalar(1); const r=new THREE.Box3().setFromObject(m).getBoundingSphere(new THREE.Sphere()).radius; const sc_=Math.min(1,0.045/Math.max(r,1e-4)); m.scale.setScalar(sc_); m.userData.trayScale=sc_; numberLabel(m, cur.ordered? stepParts.indexOf(m.name)+1 : 0); if(m.userData.label) m.userData.label.scale.set(.03/sc_,.03/sc_,1); });
  updateTray(); refreshGhosts();
}
function setTop(m,on){ m.traverse(c=>{ if(c.isMesh){ c.material.depthTest=!on; c.material.transparent=on; c.material.needsUpdate=true; c.renderOrder=on?10:0; } }); }
function updateTray(){   // tray rides with the camera like a toolbar
  const n=tray.length; if(!n) return;
  const fwd=cam.getWorldDirection(new THREE.Vector3()); const right=new THREE.Vector3().crossVectors(fwd,cam.up).normalize(); const up=new THREE.Vector3().crossVectors(right,fwd).normalize();
  const D=0.55; const vh=2*D*Math.tan(THREE.MathUtils.degToRad(cam.fov/2)), vw=vh*cam.aspect;
  const base=cam.position.clone().add(fwd.multiplyScalar(D)).add(up.multiplyScalar(-vh*0.34));
  const span=Math.min(vw*0.85,0.11*n);
  tray.forEach(m=>{ if(m===drag) return; const i=m.userData.slot; const x=n===1?0:-span/2+i*span/(n-1); m.position.copy(base).add(right.clone().multiplyScalar(x)); m.userData.trayPos=m.position.clone(); });
}
function numberLabel(m,num){ (m.userData.label&&m.remove(m.userData.label)); if(!num) return; const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d'); x.fillStyle='#4f8cff'; x.beginPath(); x.arc(32,32,30,0,7); x.fill(); x.fillStyle='#fff'; x.font='bold 36px sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(num,32,34);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false})); sp.renderOrder=11; sp.scale.set(.03,.03,1); sp.position.set(0,0.05,0); m.add(sp); m.userData.label=sp; }
function clearGhosts(){ ghosts.forEach(g=>sc.remove(g)); ghosts.length=0; }
function refreshGhosts(){ clearGhosts(); if(!cur||!cur.parts) return; const names=cur.ordered?[stepParts[orderIdx]].filter(Boolean):stepParts.filter(n=>!placedSet.has(n)); names.forEach(n=>{ const m=meshes[n]; if(!m) return; const g=new THREE.Mesh(m.geometry,GHOST); g.renderOrder=5; g.position.copy(tgt(n)); g.quaternion.copy(home[n].q); sc.add(g); ghosts.push(g); }); }

// ---- drag & drop (screen-space snapping) ----
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let drag=null, plane=new THREE.Plane(), off=new THREE.Vector3(), hitP=new THREE.Vector3();
function toNDC(e){ const rect=r.domElement.getBoundingClientRect(); ptr.set(((e.clientX-rect.left)/rect.width)*2-1,-((e.clientY-rect.top)/rect.height)*2+1); }
function screenDist(e,p3){ const rect=r.domElement.getBoundingClientRect(); const v=p3.clone().project(cam); return Math.hypot((v.x+1)/2*rect.width+rect.left-e.clientX,(1-v.y)/2*rect.height+rect.top-e.clientY); }
function pick(e){ toNDC(e); ray.setFromCamera(ptr,cam); const h=ray.intersectObjects(tray,false); if(h.length) return h[0].object;
  let best=null,bd=44; tray.forEach(m=>{ const d=screenDist(e,m.getWorldPosition(new THREE.Vector3())); if(d<bd){bd=d;best=m;} }); return best; }
r.domElement.addEventListener('pointerdown',e=>{ if(done||drag) return; pDown={x:e.clientX,y:e.clientY,t:Date.now()}; if(insp){ return; } if(!cur||!cur.parts){ return; } const m=pick(e); if(!m) return; if(!t0) t0=Date.now();
  if(cur.ordered && m.name!==stepParts[orderIdx]){ wrong(`ลำดับผิด — ชิ้นที่ ${orderIdx+1} ก่อน`); shake(m); return; }
  drag=m; m.scale.setScalar(1); if(m.userData.label) m.userData.label.scale.set(.03,.03,1); ctl.enabled=false; plane.setFromNormalAndCoplanarPoint(cam.getWorldDirection(new THREE.Vector3()).negate(), m.position); toNDC(e); ray.setFromCamera(ptr,cam); ray.ray.intersectPlane(plane,hitP); off.copy(m.position).sub(hitP); r.domElement.setPointerCapture(e.pointerId); });
r.domElement.addEventListener('pointermove',e=>{ if(!drag) return; toNDC(e); ray.setFromCamera(ptr,cam); if(ray.ray.intersectPlane(plane,hitP)) drag.position.copy(hitP.add(off)); });
r.domElement.addEventListener('pointerup',e=>{
  if(!drag && pDown){ const dd=Math.hypot(e.clientX-pDown.x,e.clientY-pDown.y), dt=Date.now()-pDown.t; pDown=null; if(dd<8 && dt<800){ if(insp){ endInspect(); return; } const h=pickPlaced(e); if(h) startInspect(h); return; } }
  pDown=null; if(!drag) return; const m=drag; drag=null; ctl.enabled=!camLocked;
  const all=cur.ordered?[stepParts[orderIdx]]:stepParts.filter(n=>!placedSet.has(n));
  const targets=all.filter(n=>sameShape(n,m.name));   // only targets of an identical part (same dimensions)
  const tol=n=>Math.max(60, 0.6*screenRadius(n));   // big parts get a bigger drop zone
  let best=null,bd=1e9; targets.forEach(n=>{ const d=screenDist(e,tgt(n))-tol(n)+60; if(d<bd){bd=d;best=n;} });
  let ob=null,od=1e9; all.forEach(n=>{ if(targets.includes(n)) return; const d=screenDist(e,tgt(n))-tol(n)+60; if(d<od){od=d;ob=n;} });
  if(best && bd<60){ snap(m,best); } else if(ob && od<60){ tween(m,m.userData.trayPos,220); if(m.userData.trayScale){ m.scale.setScalar(m.userData.trayScale); if(m.userData.label) m.userData.label.scale.set(.03/m.userData.trayScale,.03/m.userData.trayScale,1); } wrong('ผิดชิ้น — ตรงนี้คือ '+thaiName(ob)); } else { tween(m,m.userData.trayPos,220); if(m.userData.trayScale){ m.scale.setScalar(m.userData.trayScale); if(m.userData.label) m.userData.label.scale.set(.03/m.userData.trayScale,.03/m.userData.trayScale,1); } if(bd<140) wrong('ใกล้แล้ว — วางให้ตรงเงาสีฟ้า'); } });
function snap(m,target){ m.quaternion.copy(home[target].q); const par=cur.attach&&meshes[cur.attach]&&m!==meshes[cur.attach]?meshes[cur.attach]:null;
  if(par){ const to=tgt(target); par.attach(m); par.updateWorldMatrix(true,false); tween(m,par.worldToLocal(to),180); } else tween(m,tgt(target),180);
  placedSet.add(target); tray=tray.filter(x=>x!==m); tray.forEach((t,i)=>t.userData.slot=i); setTop(m,false); m.userData.inTray=false; if(m.userData.label){ m.remove(m.userData.label); m.userData.label=null; } if(cur.ordered) orderIdx++; refreshGhosts(); flash('ถูกต้อง ✓','ok');
  if(stepParts.every(n=>placedSet.has(n))){ autoPlace(cur.auto||[]); setTimeout(nextStep,500); } }
function autoPlace(names){ const par=cur&&cur.attach&&benchDelta[cur.attach]?meshes[cur.attach]:null; names.forEach(n=>{ const m=meshes[n]; if(!m) return; if(m.userData.label){ m.remove(m.userData.label); m.userData.label=null; } m.visible=true; m.userData.inTray=false; setTop(m,false); placedSet.add(n);
    if(par && m!==par){ if(m.parent!==par){ if(m.parent&&m.parent.type==='Mesh') sc.attach(m); m.scale.setScalar(1); m.position.copy(tgt(n)); m.quaternion.copy(home[n].q); par.attach(m); } }
    else { m.position.copy(home[n].p); m.quaternion.copy(home[n].q); m.scale.setScalar(1); } }); if(names.length) flash(`ใส่ให้อัตโนมัติ ${names.length} ชิ้น`,'info'); }
function wrong(t){ miss++; stageMiss[cur.stage]=(stageMiss[cur.stage]||0)+1; $('miss').textContent=miss; flash(t,'bad'); }
function shake(m){ const p=m.position.x; let i=0; const id=setInterval(()=>{ m.position.x=p+(i%2?0.01:-0.01); if(++i>6){ m.position.x=p; clearInterval(id);} },40); }
function tween(m,to,ms,cb){ const from=m.position.clone(), st=performance.now(); (function f(){ const k=Math.min(1,(performance.now()-st)/ms), e=1-Math.pow(1-k,3); m.position.lerpVectors(from,to,e); if(k<1) requestAnimationFrame(f); else cb&&cb(); })(); }
let msgT; function flash(t,c,ms=900){ const el=$('msg'); el.textContent=t; el.className=c+' show'; clearTimeout(msgT); msgT=setTimeout(()=>el.className=c,ms); }

// ---- inspect (tap an installed part to lift it out and look at it) ----
function pickPlaced(e){ toNDC(e); ray.setFromCamera(ptr,cam); const cands=Object.values(meshes).filter(m=>m.visible&&m.name!=='block'&&!m.userData.inTray&&(m.parent===null||m.parent.type!=='Mesh')); const h=ray.intersectObjects(cands,true); if(!h.length) return null; let o=h[0].object; while(o.parent&&o.parent.type==='Mesh') o=o.parent; return o; }
function startInspect(m){ insp={m,pos:m.position.clone(),quat:m.quaternion.clone(),parentDepth:[]}; m.traverse(c=>{ if(c.isMesh){ insp.parentDepth.push([c,c.material.depthTest,c.renderOrder]); c.material.depthTest=false; c.renderOrder=20; } });
  const fwd=cam.getWorldDirection(new THREE.Vector3()); const bs=new THREE.Box3().setFromObject(m).getBoundingSphere(new THREE.Sphere()); const dist=Math.max(0.3, bs.radius*3.4); const to=cam.position.clone().add(fwd.multiplyScalar(dist)); tween(m,to,250); ctl.enabled=false;
  const el=document.getElementById('insp'); el.textContent=thaiName(m.name)+'  ·  แตะอีกครั้งเพื่อวางกลับ'; el.style.display='block'; }
function endInspect(){ if(!insp) return; const {m,pos,quat,parentDepth}=insp; insp=null; m.quaternion.copy(quat); tween(m,pos,250,()=>{ parentDepth.forEach(([c,d,r])=>{ c.material.depthTest=d; c.renderOrder=r; }); }); ctl.enabled=!camLocked; document.getElementById('insp').style.display='none'; }
// ---- buttons ----
$('btnHint').onclick=()=>{ if(!cur||!cur.parts) return; const name=cur.ordered?stepParts[orderIdx]:stepParts.find(n=>!placedSet.has(n)); if(!name) return; wrong('ใช้ตัวช่วย'); const g=new THREE.Mesh(new THREE.SphereGeometry(0.03,16,12),new THREE.MeshBasicMaterial({color:0xffb648,transparent:true,opacity:.7,depthTest:false})); g.position.copy(tgt(name)); sc.add(g); let i=0; const id=setInterval(()=>{ g.scale.setScalar(1+0.5*Math.sin(i/3)); if(++i>45){ sc.remove(g); clearInterval(id);} },40); };
let vi=0; $('btnView').onclick=()=>{ const keys=Object.keys(CAM); setCam(keys[++vi%keys.length]); };
$('btnLock').onclick=e=>{ camLocked=!camLocked; ctl.enabled=!camLocked; e.target.classList.toggle('on',camLocked); e.target.textContent=camLocked?'ปลดล็อกกล้อง':'ล็อกกล้อง'; };
$('btnSkip').onclick=()=>{ if(!cur) return; if(cur.parts){ stepParts.forEach(n=>{ if(!placedSet.has(n)) autoPlace([n]); }); autoPlace(cur.auto||[]); wrong('ข้ามขั้น (-5)'); miss+=4; $('miss').textContent=miss; } $('quiz').style.display='none'; clearGhosts(); tray=[]; nextStep(); };

// ---- quiz ----
function showQuiz(q){ const box=$('quiz'); box.style.display='flex'; $('qT').textContent=q.q; $('qP').textContent='เลือกคำตอบที่ถูกต้อง'; $('qE').textContent=''; $('qNext').style.display='none'; $('qO').innerHTML='';
  q.o.forEach((o,i)=>{ const b=document.createElement('button'); b.className='opt'; b.textContent=o; b.onclick=()=>{ if($('qNext').style.display!=='none') return; [...$('qO').children].forEach(x=>x.disabled=true); if(!t0) t0=Date.now();
     if(i===q.a){ b.classList.add('ok'); } else { b.classList.add('bad'); $('qO').children[q.a].classList.add('ok'); wrong('ตอบผิด'); }
     $('qE').textContent=q.e; $('qNext').style.display='inline-block'; }; $('qO').appendChild(b); });
  $('qNext').onclick=()=>{ box.style.display='none'; nextStep(); }; }

// ---- finish ----
function finish(){ done=true; $('prog').firstElementChild.style.width='100%'; const sec=Math.round((Date.now()-(t0||Date.now()))/1000); const score=Math.max(0,100-miss*2);
  $('eT').textContent=`เสร็จสิ้น — คะแนน ${score}/100 ${score>=70?'· ผ่าน ✓':'· ไม่ผ่าน'}`; $('eP').textContent=`เวลา ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')} · ผิดพลาดรวม ${miss} ครั้ง`;
  $('eB').innerHTML='<table class="sc">'+STAGES.map((s,i)=>`<tr><td>${s.name}</td><td>${stageMiss[i]||0} ผิดพลาด</td></tr>`).join('')+'</table>'; $('end').style.display='flex'; blockMode='solid'; applyBlock(); setCam('side'); }

setInterval(()=>{ if(t0&&!done){ const s=Math.round((Date.now()-t0)/1000); $('time').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; } },500);
addEventListener('resize',()=>{ cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth,innerHeight); });
(function loop(){ requestAnimationFrame(loop); ctl.update(); updateTray(); if(insp){ insp.m.rotateOnWorldAxis(new THREE.Vector3(0,1,0),0.012); } GHOST.opacity=.25+.15*Math.sin(performance.now()/300); r.render(sc,cam); })();
</script></body></html>
